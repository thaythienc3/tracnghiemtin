<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trường THPT Lê Duẩn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }

        /* Container Các Màn Hình */
        .page { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .active-page { display: block; }

        /* Màn Hình Đăng Nhập */
        .login-card {
            background: white; border-radius: 12px; padding: 40px; max-width: 400px;
            margin: 80px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
        }
        .login-card h2 { color: #0056b3; margin-bottom: 24px; font-size: 22px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        .btn {
            background: #0056b3; color: white; border: none; padding: 12px 20px;
            width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: #004085; }

        /* Header Bài Thi */
        .exam-header {
            background: white; padding: 16px 24px; border-radius: 8px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .timer-box { font-size: 20px; font-weight: bold; color: #28a745; background: #e8f5e9; padding: 8px 16px; border-radius: 6px; }
        .timer-warning { color: #dc3545; background: #ffebee; animation: blink 1s infinite; }

        /* Nội Dung Khung Thi */
        .exam-body { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
        .question-card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .question-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .option-item {
            display: flex; align-items: center; border: 1px solid #e0e0e0; border-radius: 6px;
            padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;
        }
        .option-item:hover { background: #f8f9fa; border-color: #0056b3; }
        .option-item input { margin-right: 12px; }

        /* Sơ Đồ Câu Hỏi (Map) */
        .map-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .map-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
        .map-btn {
            padding: 10px; border: 1px solid #ccc; background: white; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .map-btn.answered { background: #28a745; color: white; border-color: #28a745; }
        .map-btn.current { border: 2px solid #0056b3; }

        /* Màn Hình Kết Quả */
        .result-card { background: white; padding: 40px; border-radius: 12px; text-align: center; max-width: 500px; margin: 40px auto; }
        .score-display { font-size: 48px; font-weight: bold; color: #28a745; margin: 20px 0; }

        /* Modal Cảnh Báo Giám Sát */
        .warning-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .warning-modal-box {
            background: #ffffff; border-radius: 12px; padding: 28px; max-width: 440px; width: 90%;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-top: 6px solid #dc3545;
        }
        .warning-modal-box h3 { color: #dc3545; margin-bottom: 14px; font-size: 22px; }
        .warning-modal-box p { font-size: 15px; color: #333; margin-bottom: 22px; line-height: 1.6; }
        .warning-modal-btn {
            background: #dc3545; color: white; border: none; padding: 12px 28px; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s;
        }
        .warning-modal-btn:hover { background: #c82333; }

        @keyframes blink { 50% { opacity: 0.6; } }
    </style>
</head>
<body>

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
    <div id="loginPage" class="page active-page">
        <div class="login-card">
            <h2>HỆ THỐNG THI TRẮC NGHIỆM</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Trường THPT Lê Duẩn</p>
            <div class="form-group">
                <label>Tài khoản học sinh:</label>
                <input type="text" id="usernameInput" placeholder="Nhập mã số học sinh">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="passwordInput" placeholder="Nhập mật khẩu">
            </div>
            <button class="btn" onclick="handleLogin()">ĐĂNG NHẬP THI</button>
        </div>
    </div>

    <!-- 2. MÀN HÌNH LÀM BÀI THI -->
    <div id="examPage" class="page">
        <div class="exam-header">
            <div>
                <h3 id="studentInfoText">Học sinh: Loading...</h3>
                <span id="examCodeText" style="color: #666; font-size: 13px;">Mã đề: Loading...</span>
            </div>
            <div id="timerDisplay" class="timer-box">00:00</div>
        </div>

        <div class="exam-body">
            <div class="question-card">
                <div id="questionTitle" class="question-title">Đang tải câu hỏi...</div>
                <div id="optionsContainer"></div>
                <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                    <button class="btn" style="width: auto; background: #6c757d;" onclick="prevQuestion()">Câu Trước</button>
                    <button class="btn" style="width: auto;" onclick="nextQuestion()">Câu Tiếp</button>
                </div>
            </div>

            <div class="map-card">
                <h4>Danh Sách Câu Hỏi</h4>
                <div id="questionMap" class="map-grid"></div>
                <button class="btn" style="background: #28a745; margin-top: 20px;" onclick="confirmSubmit()">NỘP BÀI THI</button>
            </div>
        </div>
    </div>

    <!-- 3. MÀN HÌNH KẾT QUẢ -->
    <div id="resultPage" class="page">
        <div class="result-card">
            <h2>KẾT QUẢ BÀI THI</h2>
            <p id="resultReasonText" style="color: #666; font-size: 14px; margin-top: 5px;"></p>
            <div id="scoreDisplay" class="score-display">0.0</div>
            <p id="resultDetailText">Đúng: 0/0 câu</p>
            <button class="btn" style="margin-top: 24px;" onclick="location.reload()">Trở về trang chính</button>
        </div>
    </div>

    <!-- 4. MODAL CẢNH BẢO VI PHẠM (GIÁM SÁT) -->
    <div id="warningModal" class="warning-modal-overlay" style="display: none;">
        <div class="warning-modal-box">
            <h3>⚠️ CẢNH BÁO GIÁM SÁT</h3>
            <p id="warningMessage">Bạn vừa rời khỏi màn hình làm bài!<br><b>Nếu vi phạm lần nữa, hệ thống sẽ tự động nộp bài!</b></p>
            <button class="warning-modal-btn" onclick="closeWarningModal()">Tôi đã hiểu</button>
        </div>
    </div>

    <script>
        // CẤU HÌNH API - THAY URL TRIỂN KHAI APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbysnN1nXLJ-UoMraWYVsce6JWdnRfhf8ncHv9_jgVCgRTc7iMZGPjoNDjCLcfLpiqB3/exec";

        let state = {
            token: null,
            questions: [],
            answers: {},
            currentIndex: 0,
            expiresAt: 0,
            isFinished: false
        };

        let timerInterval = null;
        let heartbeatInterval = null;
        let cheatCount = 0; // Đếm số lần rời màn hình
        let isModalShowing = false;

        // Gọi API sử dụng JSONP chống rào cản CORS trên GitHub Pages
        function api(action, params = {}, callback) {
            const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
            params.action = action;
            params.callback = callbackName;

            const queryString = Object.keys(params)
                .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
                .join('&');

            const script = document.createElement('script');
            script.src = API_URL + '?' + queryString;

            window[callbackName] = function(data) {
                delete window[callbackName];
                document.body.removeChild(script);
                if (callback) callback(data);
            };

            script.onerror = function() {
                delete window[callbackName];
                document.body.removeChild(script);
                alert("Không thể kết nối đến máy chủ API.");
            };

            document.body.appendChild(script);
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
        }

        // ĐĂNG NHẬP
        function handleLogin() {
            const u = document.getElementById('usernameInput').value.trim();
            const p = document.getElementById('passwordInput').value.trim();

            if (!u || !p) return alert("Vui lòng nhập đầy đủ tài khoản và mật khẩu!");

            api('login', { username: u, password: p }, function(res) {
                if (!res.success) return alert(res.message);

                if (res.resumed) {
                    // Khôi phục bài thi dở dang
                    state.token = res.data.token;
                    startExamSession(res.data);
                } else {
                    // Bắt đầu thi mới
                    api('start', { username: u }, function(startRes) {
                        if (startRes.success) {
                            state.token = startRes.data.token;
                            startExamSession(startRes.data);
                        } else {
                            alert(startRes.message);
                        }
                    });
                }
            });
        }

        // BẮT ĐẦU PHIÊN THI
        function startExamSession(data) {
            document.getElementById('studentInfoText').innerText = `Học sinh: ${data.studentName} (${data.className})`;
            document.getElementById('examCodeText').innerText = `Mã đề: ${data.examCode}`;
            state.expiresAt = data.expiresAt;

            api('exam', { token: state.token }, function(res) {
                if (res.success) {
                    state.questions = res.data.questions;
                    state.answers = res.data.answers || {};
                    showPage('examPage');
                    renderQuestionMap();
                    displayQuestion(0);
                    startTimer();
                    startHeartbeat();
                } else {
                    alert(res.message);
                }
            });
        }

        // HIỂN THỊ CÂU HỎI
        function displayQuestion(index) {
            if (index < 0 || index >= state.questions.length) return;
            state.currentIndex = index;

            const q = state.questions[index];
            document.getElementById('questionTitle').innerText = `Câu ${index + 1}: ${q.question}`;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            const keys = ['A', 'B', 'C', 'D'];
            keys.forEach(key => {
                if (q.options[key]) {
                    const isChecked = state.answers[q.id] === key ? 'checked' : '';
                    const optionHtml = `
                        <label class="option-item">
                            <input type="radio" name="option" value="${key}" ${isChecked} onchange="selectAnswer('${q.id}', '${key}')">
                            <b>${key}.</b>&nbsp;${q.options[key]}
                        </label>
                    `;
                    container.innerHTML += optionHtml;
                }
            });

            renderQuestionMap();
        }

        function selectAnswer(qId, key) {
            state.answers[qId] = key;
            renderQuestionMap();
            api('answer', { token: state.token, questionId: qId, selected: key });
        }

        function nextQuestion() { displayQuestion(state.currentIndex + 1); }
        function prevQuestion() { displayQuestion(state.currentIndex - 1); }

        function renderQuestionMap() {
            const mapContainer = document.getElementById('questionMap');
            mapContainer.innerHTML = '';

            state.questions.forEach((q, idx) => {
                const isAnswered = !!state.answers[q.id];
                const isCurrent = idx === state.currentIndex;
                let btnClass = 'map-btn';
                if (isAnswered) btnClass += ' answered';
                if (isCurrent) btnClass += ' current';

                mapContainer.innerHTML += `<button class="${btnClass}" onclick="displayQuestion(${idx})">${idx + 1}</button>`;
            });
        }

        // ĐỒNG HỒ ĐẾM NGƯỢC & HEARTBEAT
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = state.expiresAt - now;

                if (diff <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerDisplay').innerText = "00:00";
                    alert("Đã hết giờ làm bài!");
                    autoSubmitByTimeout();
                    return;
                }

                const mins = Math.floor(diff / 60000);
                const secs = Math.floor((diff % 60000) / 1000);
                const timerEl = document.getElementById('timerDisplay');
                timerEl.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (mins < 5) timerEl.classList.add('timer-warning');
            }, 1000);
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(() => {
                if (state.isFinished) return clearInterval(heartbeatInterval);
                api('heartbeat', { token: state.token }, function(res) {
                    if (res.expired) autoSubmitByTimeout();
                });
            }, 30000); // Send heartbeat every 30s
        }

        // NỘP BÀI THI
        function confirmSubmit() {
            if (confirm("Bạn có chắc chắn muốn nộp bài thi không?")) {
                submitExam('STUDENT_SUBMIT');
            }
        }

        function autoSubmitByTimeout() {
            submitExam('AUTO_TIMEOUT');
        }

        function autoSubmitByViolation() {
            submitExam('FORCED_SUBMIT_VIOLATION');
        }

        function submitExam(reason) {
            if (state.isFinished) return;
            state.isFinished = true;
            clearInterval(timerInterval);
            clearInterval(heartbeatInterval);

            api('submit', { token: state.token, reason: reason }, function(res) {
                if (res.success) {
                    document.getElementById('scoreDisplay').innerText = res.data.score;
                    document.getElementById('resultDetailText').innerText = `Làm đúng: ${res.data.totalCorrect}/${res.data.totalQuestions} câu`;
                    document.getElementById('resultReasonText').innerText = `Ghi chú: ${res.data.reason}`;
                    showPage('resultPage');
                } else {
                    alert("Lỗi nộp bài: " + res.message);
                }
            });
        }

        // ----------------- TÍNH NĂNG CẢNH BÁO / GIÁM SÁT VI PHẠM -----------------

        function closeWarningModal() {
            document.getElementById('warningModal').style.display = 'none';
            isModalShowing = false;
        }

        function handleCheatViolation(reasonDetail) {
            // Chỉ kiểm tra khi học sinh đang làm bài thi
            if (!state.token || state.isFinished || isModalShowing) return;

            cheatCount++;

            // Gửi nhật ký vi phạm về Google Sheet Logs
            api('event', {
                token: state.token,
                type: 'VIOLATION_LEAVE_PAGE',
                detail: `Vi phạm lần ${cheatCount}: ${reasonDetail}`
            });

            if (cheatCount === 1) {
                // Lần 1: Hiển thị cảnh báo
                isModalShowing = true;
                document.getElementById('warningMessage').innerHTML = 
                    `Bạn vừa rời khỏi màn hình làm bài (Lần 1/2)!<br><br>` +
                    `<strong style="color: #dc3545;">LƯU Ý: Nếu vi phạm lần nữa, hệ thống sẽ TỰ ĐỘNG NỘP BÀI ngay lập tức!</strong>`;
                document.getElementById('warningModal').style.display = 'flex';
            } else if (cheatCount >= 2) {
                // Lần 2: Tự động nộp bài cưỡng chế
                alert("CẢNH BÁO: Bạn đã vi phạm rời màn hình lần thứ 2! Hệ thống tự động nộp bài thi.");
                autoSubmitByViolation();
            }
        }

        // Bắt sự kiện Chuyển tab / Ẩn trình duyệt
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                handleCheatViolation('Chuyển tab hoặc thu nhỏ trình duyệt');
            }
        });

        // Bắt sự kiện Click ra ngoài cửa sổ thi
        window.addEventListener('blur', function() {
            handleCheatViolation('Mất tiêu điểm (Click ra ngoài cửa sổ làm bài)');
        });
    </script>
</body>
</html>
